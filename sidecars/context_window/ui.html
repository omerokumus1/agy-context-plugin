<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context Window</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --cw-bg: var(--background, #090b0f);
      --cw-surface: var(--card, #101319);
      --cw-surface-2: var(--secondary, #151922);
      --cw-surface-hover: var(--accent, #1b212d);
      --cw-border: var(--border, rgba(255, 255, 255, 0.08));
      --cw-border-strong: rgba(255, 255, 255, 0.14);
      --cw-fg: var(--foreground, #eef2f7);
      --cw-dim: var(--muted-foreground, #7d8696);
      --cw-track: rgba(255, 255, 255, 0.07);
      --cw-blue: #4c8df6;
      --cw-teal: #2dd4bf;
      --cw-green: #22c55e;
      --cw-amber: #f59e0b;
      --cw-red: #ef4444;
      --cw-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif);
      --cw-mono: var(--font-mono, ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace);
    }

    body[data-theme="light"] {
      --cw-bg: var(--background, #f8fafc);
      --cw-surface: var(--card, #ffffff);
      --cw-surface-2: var(--secondary, #f1f5f9);
      --cw-surface-hover: var(--accent, #e2e8f0);
      --cw-border: var(--border, rgba(15, 23, 42, 0.1));
      --cw-border-strong: rgba(15, 23, 42, 0.18);
      --cw-fg: var(--foreground, #0f172a);
      --cw-dim: var(--muted-foreground, #64748b);
      --cw-track: rgba(15, 23, 42, 0.08);
      --cw-blue: #2563eb;
      --cw-teal: #0d9488;
      --cw-green: #16a34a;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--cw-bg) !important;
      color: var(--cw-fg) !important;
      font-family: var(--cw-font);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(128, 138, 156, 0.28);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--cw-mono); font-variant-numeric: tabular-nums; }

    .app {
      padding: 12px 14px 16px;
      width: 100%;
      margin: 0 auto;
    }
    body[data-view="sidebar"] .app {
      max-width: 1120px;
      padding: 20px 24px 28px;
    }

    .grid-layout {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    body[data-view="sidebar"] .grid-layout {
      display: grid;
      grid-template-columns: minmax(320px, 410px) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) {
      body[data-view="sidebar"] .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--cw-border);
      position: relative;
    }
    .conv-wrap { min-width: 0; flex: 1; position: relative; }
    .conv-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 2px 6px 2px 2px;
      margin: -2px 0 0 -2px;
      color: var(--cw-fg);
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .conv-btn:hover {
      background: var(--cw-surface);
      border-color: var(--cw-border);
    }
    .conv-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
      background: var(--cw-dim);
    }
    .dot.live { background: var(--cw-green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
    .dot.blue { background: var(--cw-blue); }
    .dot.green { background: var(--cw-green); }
    .dot.amber { background: var(--cw-amber); }

    .chev {
      width: 12px;
      height: 12px;
      flex: none;
      color: var(--cw-dim);
      transition: transform 0.15s ease;
    }
    .model-sub {
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--cw-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--cw-dim);
      background: transparent;
      border: none;
      padding: 3px 6px;
      border-radius: 999px;
      cursor: pointer;
    }
    .live-pill:hover { background: var(--cw-surface); color: var(--cw-fg); }
    .live-pill.on { color: #86efac; }
    body[data-theme="light"] .live-pill.on { color: #15803d; }

    .icon-btn {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--cw-dim);
      cursor: pointer;
    }
    .icon-btn:hover {
      background: var(--cw-surface);
      border-color: var(--cw-border);
      color: var(--cw-fg);
    }
    .icon-btn.spinning svg { animation: spin 0.65s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Popover menus */
    .menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 50;
      min-width: 240px;
      max-width: min(340px, 92vw);
      max-height: 300px;
      overflow-y: auto;
      background: var(--cw-surface);
      border: 1px solid var(--cw-border-strong);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      padding: 5px;
      display: none;
    }
    .menu.right { left: auto; right: 0; min-width: 148px; }
    .menu.open { display: block; }
    .menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--cw-fg);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }
    .menu-item:hover { background: var(--cw-surface-hover); }
    .menu-item.active { background: rgba(76, 141, 246, 0.14); color: var(--cw-fg); }
    .menu-item-main { min-width: 0; flex: 1; }
    .menu-item-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    .menu-item-sub {
      display: block;
      font-size: 10.5px;
      color: var(--cw-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .menu-sep { height: 1px; background: var(--cw-border); margin: 4px 2px; }

    /* Hero Usage */
    .hero { display: flex; flex-direction: column; gap: 8px; }
    .hero-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      position: relative;
    }
    .pct-big {
      display: inline-flex;
      align-items: baseline;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .pct-int { font-size: 28px; }
    .pct-dec { font-size: 18px; font-weight: 600; color: rgba(238, 242, 247, 0.85); }
    body[data-theme="light"] .pct-dec { color: rgba(15, 23, 42, 0.78); }
    .pct-big.warn { color: var(--cw-amber); }
    .pct-big.warn .pct-dec { color: var(--cw-amber); opacity: 0.85; }
    .pct-big.crit { color: var(--cw-red); }
    .pct-big.crit .pct-dec { color: var(--cw-red); opacity: 0.85; }

    .limit-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 6px;
      color: var(--cw-dim);
      font-size: 12.5px;
      cursor: pointer;
    }
    .limit-btn:hover {
      background: var(--cw-surface);
      border-color: var(--cw-border);
      color: var(--cw-fg);
    }
    .limit-btn strong { color: var(--cw-fg); font-weight: 600; }

    .bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--cw-track);
      overflow: hidden;
      display: flex;
    }
    .bar-seg {
      height: 100%;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bar-cache { background: var(--cw-blue); }
    .bar-uncached { background: var(--cw-green); }

    .legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--cw-dim);
    }
    .legend-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-item strong { color: var(--cw-fg); font-weight: 500; }

    /* 3-card metrics row */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .card {
      background: var(--cw-surface);
      border: 1px solid var(--cw-border);
      border-radius: 9px;
      padding: 9px 10px;
      min-width: 0;
    }
    .card-label {
      font-size: 11px;
      color: var(--cw-dim);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-val {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--cw-fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      margin-top: 2px;
      font-size: 10.5px;
      color: var(--cw-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Section headers */
    .section {
      padding-top: 12px;
      border-top: 1px solid var(--cw-border);
    }
    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .sec-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--cw-fg);
    }
    .sec-meta {
      font-size: 11.5px;
      color: var(--cw-dim);
    }

    /* Timeline SVG */
    .chart-box {
      position: relative;
      width: 100%;
    }
    .chart-svg {
      width: 100%;
      height: 112px;
      display: block;
      overflow: visible;
    }
    body[data-view="sidebar"] .chart-svg {
      height: 170px;
    }
    .chart-x {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--cw-dim);
      margin-top: 3px;
      font-family: var(--cw-mono);
    }
    .chart-tip {
      position: absolute;
      top: 4px;
      left: 8px;
      pointer-events: none;
      background: var(--cw-surface-2);
      border: 1px solid var(--cw-border-strong);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      color: var(--cw-fg);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      display: none;
      z-index: 10;
      white-space: nowrap;
    }
    .chart-tip.show { display: block; }

    /* Top Spikes */
    .spikes {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spike-row {
      display: grid;
      grid-template-columns: 36px auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 7px;
      background: var(--cw-surface);
      border: 1px solid transparent;
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .spike-row:hover, .spike-row.active {
      border-color: var(--cw-border-strong);
      background: var(--cw-surface-hover);
    }
    .spike-step {
      font-size: 11px;
      color: var(--cw-dim);
      font-family: var(--cw-mono);
    }
    .spike-badge {
      font-size: 11px;
      font-family: var(--cw-mono);
      color: var(--cw-fg);
      background: var(--cw-surface-2);
      border: 1px solid var(--cw-border);
      border-radius: 5px;
      padding: 1px 6px;
      white-space: nowrap;
    }
    .spike-detail {
      font-size: 11.5px;
      color: var(--cw-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spike-delta {
      font-size: 12px;
      font-weight: 600;
      color: var(--cw-teal);
      font-family: var(--cw-mono);
      white-space: nowrap;
    }

    /* Turn Ledger (shown in Sidebar /full view) */
    .ledger-wrap {
      display: none;
      background: var(--cw-surface);
      border: 1px solid var(--cw-border);
      border-radius: 10px;
      overflow: hidden;
    }
    body[data-view="sidebar"] .ledger-wrap { display: block; }
    .ledger-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--cw-border);
    }
    .ledger-scroll {
      max-height: 360px;
      overflow-y: auto;
    }
    table.ledger {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.ledger th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--cw-surface-2);
      color: var(--cw-dim);
      font-weight: 500;
      font-size: 11px;
      text-align: right;
      padding: 7px 10px;
      border-bottom: 1px solid var(--cw-border);
    }
    table.ledger th:first-child,
    table.ledger th:nth-child(2) { text-align: left; }
    table.ledger td {
      padding: 6px 10px;
      text-align: right;
      border-bottom: 1px solid var(--cw-border);
      font-variant-numeric: tabular-nums;
    }
    table.ledger td:first-child,
    table.ledger td:nth-child(2) { text-align: left; }
    table.ledger tr:last-child td { border-bottom: none; }
    table.ledger tr:hover td { background: var(--cw-surface-hover); }
    .compact-tag {
      font-size: 10px;
      color: var(--cw-amber);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 999px;
      padding: 0 5px;
      margin-left: 4px;
    }

    /* Footer */
    .footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--cw-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--cw-dim);
    }
    .ghost-btn {
      font: inherit;
      font-size: 11px;
      color: var(--cw-dim);
      background: transparent;
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .ghost-btn:hover { color: var(--cw-fg); border-color: var(--cw-border-strong); }

    .empty-state {
      padding: 42px 16px;
      text-align: center;
      color: var(--cw-dim);
      font-size: 12.5px;
    }
    .empty-state strong { display: block; color: var(--cw-fg); margin-bottom: 6px; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="empty-state"><strong>Context Window</strong>Loading live session telemetry…</div>
  </div>

  <script>
    (() => {
      const POLL_MS = 2500;
      const LIMIT_PRESETS = [
        { label: 'Auto (model)', value: 0 },
        { label: '128K', value: 128_000 },
        { label: '200K', value: 200_000 },
        { label: '256K', value: 256_000 },
        { label: '512K', value: 512_000 },
        { label: '1M', value: 1_000_000 },
        { label: '2M', value: 2_000_000 },
      ];

      const isSidebar = window.location.pathname.startsWith('/full');
      document.body.setAttribute('data-view', isSidebar ? 'sidebar' : 'aux');

      // Sync theme with Antigravity /preload.js CSS variables
      function parseRgb(str) {
        if (!str) return null;
        const hex = str.trim().match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (hex) {
          let h = hex[1];
          if (h.length === 3) h = h.split('').map((c) => c + c).join('');
          return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        const rgb = str.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
        return rgb ? [Number(rgb[1]), Number(rgb[2]), Number(rgb[3])] : null;
      }

      function syncTheme() {
        const qp = new URLSearchParams(window.location.search).get('theme');
        if (qp === 'light' || qp === 'dark') {
          document.body.setAttribute('data-theme', qp);
          return;
        }
        const style = getComputedStyle(document.documentElement);
        const bg = (document.documentElement.style.getPropertyValue('--background') || style.getPropertyValue('--background') || '').trim();
        const rgb = parseRgb(bg);
        let theme = 'dark';
        if (rgb) {
          const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
          theme = lum > 0.45 ? 'light' : 'dark';
        } else if (window.sidecar && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
        document.body.setAttribute('data-theme', theme);
      }

      syncTheme();
      window.addEventListener('message', (ev) => {
        if (ev?.data?.type === 'theme-change') {
          const vars = ev.data.payload?.cssVariables;
          if (vars && typeof vars === 'object') {
            for (const [k, v] of Object.entries(vars)) {
              document.documentElement.style.setProperty(k, v);
            }
          }
          syncTheme();
        }
      });

      const sidecarFetch = (window.sidecar && typeof window.sidecar.fetch === 'function')
        ? window.sidecar.fetch.bind(window.sidecar)
        : window.fetch.bind(window);

      const state = {
        snapshot: null,
        conversations: [],
        selectedCascadeId: '',
        workspaceUri: '',
        paused: false,
        openMenu: null, // 'conv' | 'limit' | null
        hoveredTurnIdx: null,
        pinnedStepIdx: null,
        lastEtag: '',
        refreshing: false,
      };

      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));

      function fmtTok(n) {
        const num = Number(n) || 0;
        const sign = num < 0 ? '-' : '';
        const abs = Math.abs(num);
        if (abs >= 1_000_000) {
          const m = abs / 1_000_000;
          return sign + (Number.isInteger(m) ? `${m}M` : `${m.toFixed(1)}M`);
        }
        if (abs >= 100_000) return `${sign}${Math.round(abs / 1000)}K`;
        if (abs >= 10_000) return `${sign}${(abs / 1000).toFixed(1)}K`;
        if (abs >= 1_000) return `${sign}${(abs / 1000).toFixed(2).replace(/0$/, '')}K`;
        return `${sign}${Math.round(abs)}`;
      }

      function fmtRel(iso) {
        if (!iso) return '';
        const ts = Date.parse(iso);
        if (!Number.isFinite(ts)) return '';
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (s < 5) return 'just now';
        if (s < 60) return `${s}s ago`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}h ago`;
        return `${Math.floor(h / 24)}d ago`;
      }

      async function apiPost(url, body) {
        const res = await sidecarFetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        return res.json();
      }

      function renderChart(timeline) {
        const turns = timeline?.turns || [];
        if (turns.length === 0) {
          return `<div class="empty-state" style="padding:20px 0;">No turn history yet.</div>`;
        }

        const W = 360;
        const H = isSidebar ? 168 : 108;
        const padL = 2;
        const padR = 40;
        const padT = 8;
        const padB = 6;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const yMax = Math.max(timeline.yMax || 1, 1);

        const xOf = (i) => turns.length === 1
          ? padL + plotW / 2
          : padL + (i / (turns.length - 1)) * plotW;
        const yOf = (val) => padT + plotH - Math.min(1, Math.max(0, val / yMax)) * plotH;

        const totalPts = turns.map((t, i) => [xOf(i), yOf(t.totalTokens)]);
        const cachePts = turns.map((t, i) => [xOf(i), yOf(t.cacheTokens)]);

        const toPath = (pts) => pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
        const toArea = (pts) => {
          if (pts.length === 0) return '';
          const line = toPath(pts);
          const base = padT + plotH;
          return `${line} L${pts[pts.length - 1][0].toFixed(1)},${base} L${pts[0][0].toFixed(1)},${base} Z`;
        };

        const yMid = Math.round(yMax / 2);
        const gridY = [padT, padT + plotH / 2, padT + plotH];
        const gridLabels = [fmtTok(yMax), fmtTok(yMid), '0'];

        // Highlight pinned spike or hovered turn
        const activeIdx = state.hoveredTurnIdx !== null
          ? state.hoveredTurnIdx
          : (state.pinnedStepIdx !== null ? turns.findIndex((t) => t.stepIndex === state.pinnedStepIdx) : -1);

        let markerSvg = '';
        if (activeIdx >= 0 && activeIdx < turns.length) {
          const [mx, my] = totalPts[activeIdx];
          markerSvg = `
            <line x1="${mx.toFixed(1)}" y1="${padT}" x2="${mx.toFixed(1)}" y2="${padT + plotH}" stroke="var(--cw-fg)" stroke-opacity="0.25" stroke-dasharray="2 2"/>
            <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="3.5" fill="var(--cw-teal)" stroke="var(--cw-bg)" stroke-width="1.5"/>
          `;
        }

        return `
          <div class="chart-box" id="chart-box">
            <div class="chart-tip" id="chart-tip"></div>
            <svg class="chart-svg" id="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
              <defs>
                <linearGradient id="g-total" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--cw-teal)" stop-opacity="0.24"/>
                  <stop offset="100%" stop-color="var(--cw-teal)" stop-opacity="0.01"/>
                </linearGradient>
                <linearGradient id="g-cache" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--cw-blue)" stop-opacity="0.22"/>
                  <stop offset="100%" stop-color="var(--cw-blue)" stop-opacity="0.01"/>
                </linearGradient>
              </defs>
              ${gridY.map((gy, idx) => `
                <line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="var(--cw-border)" stroke-width="1"/>
                <text x="${W - 2}" y="${(gy + 3).toFixed(1)}" text-anchor="end" fill="var(--cw-dim)" font-size="9.5" font-family="var(--cw-mono)">${esc(gridLabels[idx])}</text>
              `).join('')}
              <path d="${toArea(totalPts)}" fill="url(#g-total)"/>
              <path d="${toArea(cachePts)}" fill="url(#g-cache)"/>
              <path d="${toPath(cachePts)}" fill="none" stroke="var(--cw-blue)" stroke-width="1.5" stroke-opacity="0.9"/>
              <path d="${toPath(totalPts)}" fill="none" stroke="var(--cw-teal)" stroke-width="1.75"/>
              ${markerSvg}
            </svg>
            <div class="chart-x">
              <span>#${timeline.minStep}</span>
              <span>#${timeline.maxStep}</span>
            </div>
          </div>
        `;
      }

      function render() {
        const root = document.getElementById('app');
        const snap = state.snapshot;
        if (!snap || snap.error) {
          const msg = snap?.error === 'no-conversation'
            ? 'Open or start a conversation in Antigravity to view its live context window.'
            : (snap?.message || 'Waiting for Antigravity session data…');
          root.innerHTML = `<div class="empty-state"><strong>Context Window</strong>${esc(msg)}</div>`;
          return;
        }

        const { conversation: conv, context: ctx, metrics, timeline, topSpikes } = snap;
        const pctStr = ctx.usedPct.toFixed(1);
        const [pctInt, pctDec] = pctStr.split('.');
        const pctTone = ctx.usedPct >= 90 ? 'crit' : (ctx.usedPct >= 75 ? 'warn' : '');

        const limitTotal = Math.max(ctx.limitTokens, 1);
        const cacheWidth = Math.min(100, (ctx.cacheTokens / limitTotal) * 100);
        const uncachedWidth = Math.min(Math.max(0, 100 - cacheWidth), (ctx.uncachedTokens / limitTotal) * 100);

        const activeConvs = state.conversations || [];
        const activeId = state.selectedCascadeId || conv.cascadeId;

        const headerHtml = `
          <header class="header">
            <div class="conv-wrap">
              <button class="conv-btn" id="conv-btn" title="Switch monitored conversation">
                <span class="dot ${conv.isRunning ? 'live' : 'green'}"></span>
                <span class="conv-title">${esc(conv.title)}</span>
                <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="model-sub">${esc(conv.model)} · <span id="rel-age">${esc(fmtRel(conv.lastModifiedTime) || conv.updatedAgo)}</span></div>
              <div class="menu ${state.openMenu === 'conv' ? 'open' : ''}" id="conv-menu">
                <button class="menu-item ${!state.selectedCascadeId ? 'active' : ''}" data-cascade="">
                  <span class="menu-item-main">
                    <span class="menu-item-title">Auto (Active Conversation)</span>
                    <span class="menu-item-sub">Follow current chat automatically</span>
                  </span>
                </button>
                ${activeConvs.length ? '<div class="menu-sep"></div>' : ''}
                ${activeConvs.map((c) => `
                  <button class="menu-item ${state.selectedCascadeId === c.cascadeId ? 'active' : ''}" data-cascade="${esc(c.cascadeId)}">
                    <span class="dot ${/RUNNING|ACTIVE/i.test(c.status) ? 'live' : ''}"></span>
                    <span class="menu-item-main">
                      <span class="menu-item-title">${esc(c.title)}</span>
                      <span class="menu-item-sub">${esc(c.model)} · ${esc(fmtRel(c.lastModifiedTime))}</span>
                    </span>
                  </button>
                `).join('')}
              </div>
            </div>
            <div class="header-actions">
              <button class="live-pill ${!state.paused ? 'on' : ''}" id="live-btn" title="${state.paused ? 'Resume live polling' : 'Pause live polling'}">
                <span class="dot ${!state.paused ? 'live' : 'amber'}"></span>
                <span>${state.paused ? 'Paused' : 'Live'}</span>
              </button>
              <button class="icon-btn ${state.refreshing ? 'spinning' : ''}" id="refresh-btn" title="Refresh now">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <path d="M13.6 8a5.6 5.6 0 1 1-1.4-3.7M13.6 2.6v2.8h-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </header>
        `;

        const heroHtml = `
          <section class="hero">
            <div class="hero-top">
              <div class="pct-big num ${pctTone}">
                <span class="pct-int">${esc(pctInt)}</span><span class="pct-dec">.${esc(pctDec)}%</span>
              </div>
              <div style="position:relative;">
                <button class="limit-btn num" id="limit-btn" title="Override context window ceiling">
                  <strong>${esc(fmtTok(ctx.usedTokens))}</strong>
                  <span>/ ${esc(fmtTok(ctx.limitTokens))}</span>
                  <svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="menu right ${state.openMenu === 'limit' ? 'open' : ''}" id="limit-menu">
                  ${LIMIT_PRESETS.map((p) => `
                    <button class="menu-item ${ctx.overrideLimit === p.value ? 'active' : ''}" data-limit="${p.value}">
                      <span>${esc(p.label)}</span>
                      ${p.value === 0 ? `<span class="sec-meta">${esc(fmtTok(ctx.autoLimitTokens))}</span>` : ''}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
            <div class="bar-track" title="Cache: ${fmtTok(ctx.cacheTokens)} | Uncached: ${fmtTok(ctx.uncachedTokens)} | Free: ${fmtTok(ctx.freeTokens)}">
              <div class="bar-seg bar-cache" style="width:${cacheWidth.toFixed(2)}%"></div>
              <div class="bar-seg bar-uncached" style="width:${uncachedWidth.toFixed(2)}%"></div>
            </div>
            <div class="legend">
              <div class="legend-left">
                <span class="legend-item"><span class="dot blue"></span>Cache <strong class="num">${esc(fmtTok(ctx.cacheTokens))}</strong></span>
                <span class="legend-item"><span class="dot green"></span>Uncached <strong class="num">${esc(fmtTok(ctx.uncachedTokens))}</strong></span>
              </div>
              <span class="num">Free <strong style="color:var(--cw-fg);font-weight:500;">${esc(fmtTok(ctx.freeTokens))}</strong></span>
            </div>
          </section>
        `;

        const cardsHtml = `
          <section class="cards">
            <div class="card" title="Session cumulative cache hit: ${metrics.cacheHitSessionPct.toFixed(1)}%">
              <div class="card-label">Cache Hit</div>
              <div class="card-val num">${metrics.cacheHitLastTurnPct.toFixed(1)}%</div>
              <div class="card-sub">last turn</div>
            </div>
            <div class="card" title="Response: ${fmtTok(metrics.totalResponseTokens)} · Thinking: ${fmtTok(metrics.totalThinkingTokens)}">
              <div class="card-label">Output</div>
              <div class="card-val num">${esc(fmtTok(metrics.totalOutputTokens))}</div>
              <div class="card-sub">total tokens</div>
            </div>
            <div class="card" title="Duration: ${esc(metrics.durationLabel)}">
              <div class="card-label">Activity</div>
              <div class="card-val num">${metrics.turnCount} turns</div>
              <div class="card-sub">${metrics.toolCount} tools · ${esc(metrics.durationLabel)}</div>
            </div>
          </section>
        `;

        const timelineHtml = `
          <section class="section">
            <div class="sec-head">
              <span class="sec-title">Timeline</span>
              <span class="sec-meta num">${metrics.turnCount} turns</span>
            </div>
            ${renderChart(timeline)}
          </section>
        `;

        const spikesHtml = `
          <section class="section">
            <div class="sec-head">
              <span class="sec-title">Top Spikes</span>
              <span class="sec-meta">top ${topSpikes.length}</span>
            </div>
            <div class="spikes">
              ${topSpikes.length === 0
                ? '<div class="sec-meta">No positive spikes recorded yet.</div>'
                : topSpikes.map((s) => `
                  <div class="spike-row ${state.pinnedStepIdx === s.stepIndex ? 'active' : ''}" data-spike-step="${s.stepIndex}">
                    <span class="spike-step">#${s.stepIndex}</span>
                    <span class="spike-badge">${esc(s.badge)}</span>
                    <span class="spike-detail">${esc(s.detail)}</span>
                    <span class="spike-delta">+${esc(fmtTok(s.deltaTokens))}</span>
                  </div>
                `).join('')}
            </div>
          </section>
        `;

        const ledgerHtml = `
          <section class="ledger-wrap">
            <div class="ledger-head">
              <span class="sec-title">Turn Ledger</span>
              <span class="sec-meta">${timeline.turns.length} generations</span>
            </div>
            <div class="ledger-scroll">
              <table class="ledger">
                <thead>
                  <tr>
                    <th>Step</th>
                    <th>Model</th>
                    <th>Total</th>
                    <th>Cache</th>
                    <th>Uncached</th>
                    <th>Hit</th>
                    <th>Delta</th>
                    <th>Out</th>
                  </tr>
                </thead>
                <tbody>
                  ${[...timeline.turns].reverse().map((t) => `
                    <tr>
                      <td class="mono">#${t.stepIndex}${t.isCompaction ? '<span class="compact-tag">compact</span>' : ''}</td>
                      <td>${esc(t.model)}</td>
                      <td class="mono">${esc(fmtTok(t.totalTokens))}</td>
                      <td class="mono" style="color:var(--cw-blue)">${esc(fmtTok(t.cacheTokens))}</td>
                      <td class="mono" style="color:var(--cw-green)">${esc(fmtTok(t.uncachedTokens))}</td>
                      <td class="mono">${t.cacheHitPct.toFixed(0)}%</td>
                      <td class="mono" style="color:${t.deltaTokens < 0 ? 'var(--cw-amber)' : 'var(--cw-teal)'}">${t.deltaTokens >= 0 ? '+' : ''}${esc(fmtTok(t.deltaTokens))}</td>
                      <td class="mono">${esc(fmtTok(t.outputTokens))}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </section>
        `;

        const footerHtml = `
          <footer class="footer">
            <button class="ghost-btn" id="copy-btn">Copy /context</button>
            <span class="num">${esc(snap.source || 'live')}</span>
          </footer>
        `;

        if (isSidebar) {
          root.innerHTML = `
            ${headerHtml}
            <div class="grid-layout" style="margin-top:14px;">
              <div class="col">
                ${heroHtml}
                ${cardsHtml}
                ${spikesHtml}
                ${footerHtml}
              </div>
              <div class="col">
                ${timelineHtml}
                ${ledgerHtml}
              </div>
            </div>
          `;
        } else {
          root.innerHTML = `
            <div class="grid-layout">
              ${headerHtml}
              ${heroHtml}
              ${cardsHtml}
              ${timelineHtml}
              ${spikesHtml}
              ${footerHtml}
            </div>
          `;
        }

        wireEvents();
      }

      function wireEvents() {
        const convBtn = document.getElementById('conv-btn');
        const limitBtn = document.getElementById('limit-btn');
        const liveBtn = document.getElementById('live-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const copyBtn = document.getElementById('copy-btn');

        convBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          state.openMenu = state.openMenu === 'conv' ? null : 'conv';
          render();
        });

        limitBtn?.addEventListener('click', (e) => {
          e.stopPropagation();
          state.openMenu = state.openMenu === 'limit' ? null : 'limit';
          render();
        });

        document.querySelectorAll('[data-cascade]').forEach((el) => {
          el.addEventListener('click', async (e) => {
            e.stopPropagation();
            state.selectedCascadeId = el.getAttribute('data-cascade') || '';
            state.openMenu = null;
            state.lastEtag = '';
            state.pinnedStepIdx = null;
            await refresh(true);
          });
        });

        document.querySelectorAll('[data-limit]').forEach((el) => {
          el.addEventListener('click', async (e) => {
            e.stopPropagation();
            const val = Number(el.getAttribute('data-limit')) || 0;
            state.openMenu = null;
            state.lastEtag = '';
            await apiPost('/api/preferences', { overrideLimit: val });
            await refresh(true);
          });
        });

        liveBtn?.addEventListener('click', () => {
          state.paused = !state.paused;
          render();
          if (!state.paused) refresh(true);
        });

        refreshBtn?.addEventListener('click', () => refresh(true));

        copyBtn?.addEventListener('click', async () => {
          const text = state.snapshot?.textReport || '';
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy /context'; }, 1400);
        });

        document.querySelectorAll('[data-spike-step]').forEach((el) => {
          el.addEventListener('click', () => {
            const stepIdx = Number(el.getAttribute('data-spike-step'));
            state.pinnedStepIdx = state.pinnedStepIdx === stepIdx ? null : stepIdx;
            render();
          });
        });

        const chartSvg = document.getElementById('chart-svg');
        const chartTip = document.getElementById('chart-tip');
        const turns = state.snapshot?.timeline?.turns || [];
        if (chartSvg && chartTip && turns.length > 0) {
          chartSvg.addEventListener('mousemove', (ev) => {
            const rect = chartSvg.getBoundingClientRect();
            const plotW = Math.max(1, rect.width * (318 / 360));
            const relX = Math.max(0, Math.min(1, (ev.clientX - rect.left) / plotW));
            const idx = turns.length === 1 ? 0 : Math.round(relX * (turns.length - 1));
            const t = turns[idx];
            if (!t) return;
            state.hoveredTurnIdx = idx;
            chartTip.innerHTML = `<span class="mono">#${t.stepIndex}</span> · <strong>${fmtTok(t.totalTokens)}</strong> (Cache ${t.cacheHitPct.toFixed(0)}%) · ${t.deltaTokens >= 0 ? '+' : ''}${fmtTok(t.deltaTokens)}`;
            chartTip.classList.add('show');
          });
          chartSvg.addEventListener('mouseleave', () => {
            state.hoveredTurnIdx = null;
            chartTip.classList.remove('show');
          });
        }
      }

      document.addEventListener('click', () => {
        if (state.openMenu) {
          state.openMenu = null;
          render();
        }
      });

      async function refresh(force = false) {
        if (document.hidden && !force) return;
        if (state.paused && !force) return;
        if (force) {
          state.refreshing = true;
          const btn = document.getElementById('refresh-btn');
          if (btn) btn.classList.add('spinning');
        }
        try {
          const activeId = state.selectedCascadeId || (window.sidecar && window.sidecar.conversationId) || '';
          const qs = new URLSearchParams({
            conversationId: activeId,
            workspace: state.workspaceUri,
            etag: force ? '' : state.lastEtag,
          });
          const res = await sidecarFetch(`/api/snapshot?${qs}`);
          const data = await res.json();
          if (data && data.unchanged) return;
          state.lastEtag = data.etag || '';
          state.snapshot = data.snapshot || data;
          if (Array.isArray(data.conversations)) {
            state.conversations = data.conversations;
          }
          render();
        } catch {
          // keep last snapshot cleanly on transient errors
        } finally {
          state.refreshing = false;
          const btn = document.getElementById('refresh-btn');
          if (btn) btn.classList.remove('spinning');
        }
      }

      // Tick relative timestamps gently without full re-render
      setInterval(() => {
        const el = document.getElementById('rel-age');
        const iso = state.snapshot?.conversation?.lastModifiedTime;
        if (el && iso) el.textContent = fmtRel(iso);
      }, 1000);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !state.paused) refresh(true);
      });

      async function boot() {
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            state.workspaceUri = uris?.[0] || '';
            if (typeof window.sidecar.onWorkspaceChange === 'function') {
              window.sidecar.onWorkspaceChange((next) => {
                const nextUri = next?.[0] || '';
                if (nextUri !== state.workspaceUri) {
                  state.workspaceUri = nextUri;
                  state.lastEtag = '';
                  refresh(true);
                }
              });
            }
          } catch {
            // ignore workspace bridge failures
          }
        }
        await refresh(true);
        setInterval(() => refresh(false), POLL_MS);
      }

      boot();
    })();
  </script>
</body>
</html>
